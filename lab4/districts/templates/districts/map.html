<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Districts from PostGIS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #23373b; background: #f4f6f6; }
    header { padding: 16px 24px 12px; }
    h1 { margin: 0; font-size: 22px; }
    .subtitle { margin: 4px 0 0; color: #5b6a6e; }
    #panel { padding: 10px 24px 12px; display: flex; align-items: center; gap: 12px; }
    #province { padding: 4px 6px; }
    #count { color: #5b6a6e; font-size: 14px; }
    #map { height: calc(100vh - 140px); min-height: 400px; }
  </style>
</head>
<body>
  <header>
    <h1>Districts from PostGIS</h1>
    <p class="subtitle">Served by Django from the database.</p>
  </header>

  <div id="panel">
    <label for="province">Province</label>
    <select id="province">
      <option value="">All provinces</option>
    </select>
    <span id="count">loading...</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DISTRICTS_URL = "{% url 'districts-geojson' %}";
    const WHERE_URL = "{% url 'district-at' %}";

    const map = L.map('map', {
      maxBounds: [[21.5, 58.5], [39.0, 80.5]],
      maxBoundsViscosity: 1.0,
      minZoom: 5
    }).setView([30.3753, 69.3451], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors, tiles by OSM France'
    }).addTo(map);

    const colours = {
      'Punjab': '#1b9e77',
      'Sindh': '#d95f02',
      'Khyber Pakhtunkhwa': '#7570b3',
      'Balochistan': '#e7298a',
      'Islamabad': '#66a61e',
      'Azad Kashmir': '#e6ab02',
      'Gilgit Baltistan': '#a6761d'
    };

    const GREY = '#c9cfd1';

    let layer = null;
    let provincesFilled = false;

    function show(value) {
      return value === null || value === undefined ? 'not recorded' : value.toLocaleString();
    }

    function fillProvinceList(features) {
      if (provincesFilled) return;
      const select = document.getElementById('province');
      const names = [...new Set(features.map(f => f.properties.province))].sort();
      for (const name of names) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      }
      provincesFilled = true;
    }

    async function loadDistricts(province) {
      const url = province
        ? DISTRICTS_URL + '?province=' + encodeURIComponent(province)
        : DISTRICTS_URL;

      const response = await fetch(url);
      if (!response.ok) {
        console.error('Request failed with status ', response.status);
        return;
      }
      const data = await response.json();

      fillProvinceList(data.features);

      if (layer) {
        map.removeLayer(layer);
      }

      layer = L.geoJSON(data, {
        style: function (feature) {
          // districts with no census value are grey, not part of the colour scale
          const pop = feature.properties.pop_2023;
          return {
            color: '#ffffff',
            weight: 1,
            fillColor: pop === null ? GREY : (colours[feature.properties.province] || '#888888'),
            fillOpacity: 0.7
          };
        },
        onEachFeature: function (feature, featureLayer) {
          const p = feature.properties;
          featureLayer.bindTooltip(p.name + ', ' + p.province, { sticky: true });
        }
      }).addTo(map);

      if (data.features.length > 0) {
        map.fitBounds(layer.getBounds());
      }
      document.getElementById('count').textContent = data.features.length + ' districts';
    }

    loadDistricts();

    document.getElementById('province').addEventListener('change', function (event) {
      loadDistricts(event.target.value);
    });

    // ask PostGIS which district contains the clicked point
    map.on('click', async function (e) {
      const url = WHERE_URL + '?lat=' + e.latlng.lat + '&lng=' + e.latlng.lng;
      const answer = await (await fetch(url)).json();

      const text = answer.district
        ? '<strong>' + answer.district + '</strong>, ' + answer.province +
          '<br>Population: ' + show(answer.pop_2023)
        : 'Not inside any district';

      L.popup().setLatLng(e.latlng).setContent(text).openOn(map);
    });
  </script>
</body>
</html>
